# Flat list. `group` controls how skills are rendered in CV and on the
# website. Groups are ordered to lead with the rarest, highest-leverage
# skills (AI/ML on edge, programming, computer vision), then architecture
# and regulated-systems work, then domain breadth (robotics, sensors,
# infra). Spoken languages stay separate in `bio.yaml` and render last
# in the CV.
