summary: >
  A joint research programme between Italdesign, Volkswagen Group's
  Data:Lab Munich innovation centre and Roborace to develop and
  validate machine-learning algorithms for high-performance autonomous
  driving. The work used Roborace's DevBot 2.0 — an all-electric race
  car that can be driven by a human or by an AI stack — as a testbed
  to push perception and decision-making to the limits of vehicle
  dynamics, under Roborace's "Research to Road" philosophy.
highlights:
  - Trained and deployed convolutional neural networks for object detection and semantic segmentation on the Roborace testbed.
  - Contributed to the perception and obstacle-avoidance stack validated on track with the DevBot 2.0 autonomous race car.
  - Worked alongside Data:Lab Munich data scientists on machine-learning algorithms optimised for high-speed, dynamic racing conditions.
