id: pop-up-next
name: Pop.Up Next
subtitle: Modular flying taxi in collaboration with Airbus and Audi
organisation: Italdesign
parent: italdesign
location: Turin, Italy
start: 2017
end: 2019
stack: [C++, ROS, Computer Vision]
tags: [autonomous-driving, drones, perception, visual-servoing]
url: https://www.italdesign.it/project/pop-up-next/
summary: >
  An electric, modular and autonomous concept that couples a ground
  module, a cabin and an aerial drone module. Demonstrated at Amsterdam
  Drone Week 2018 with a 1:4 scale flying prototype. Starting from a
  blank sheet and a six-month deadline, I defined the ground-module
  sensor and compute stack, adapted ROS and Autoware to the vehicle,
  and set up simulation-driven validation before hardware was ready.
highlights:
  - Defined the hardware and software architecture for the autonomous ground module, including cameras, lidars, radars, ultrasonics, GNSS/IMU, Nvidia PX2 and MicroAutoBox.
  - Introduced SIL with CARLA and HIL with dSPACE SCALEXIO/IPG CarMaker to validate perception, localisation, planning and control before vehicle integration.
  - Delivered the first autonomous shuttle demo with lidar mapping, lidar and GNSS+RTK localisation, offline path generation, obstacle detection, emergency braking, PID/MPC control and mobile-app destination selection.
  - Vision-based drone detection and pose estimation from the car module.
  - Autonomous navigation for centring and latching with the drone module.
  - Helped turn Italdesign's first software and robotics project into follow-on work and patents.
