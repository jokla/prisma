id: into
name: InTo
subtitle: AI-Powered Coach Crowding Prediction Service
organisation: Italdesign
parent: italdesign
location: Turin, Italy
start: 2018
end: 2019
stack: [Python, Deep Learning, Computer Vision]
tags: [machine-learning, computer-vision, smart-city]
url: https://www.italdesign.it/project/into/
summary: >
  A service that improves travel on the metro by analysing on-board and
  station camera feeds to predict coach crowding and passenger flow.
  The system estimated train presence, coach occupancy and alighting
  flow in real time, then guided passengers on the platform towards
  less crowded carriages with green, yellow and orange visual signals.
highlights:
  - Led the ML and computer-vision work for a real-time passenger-information system combining onboard and station cameras.
  - Used CNN classification for train presence, coach occupancy estimation and alighting-flow estimation.
  - Used detection and tracking for door open/close events, people detection and people counting.
  - Built a random-forest model to predict how many passengers would exit each train.
  - Deployed successfully at the Re Umberto station in Turin from May 2019.
