stack: [Python, Deep Learning, Computer Vision]
tags: [machine-learning, computer-vision, smart-city]
url: https://www.italdesign.it/project/into/
summary: >
  A service that improves travel on the metro by analysing on-board and
  station camera feeds to predict coach crowding and passenger flow.
highlights:
  - Convolutional Neural Networks for crowd estimation and people counting.
  - Machine-learning model to predict the passengers exiting each train.
  - Deployed successfully at the Re Umberto station in Turin from May 2019.
