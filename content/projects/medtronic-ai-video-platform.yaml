summary: >
  The AI-video platform delivers real-time
  guidance during robotic and laparoscopic surgery. As Sr. Principal
  Software Engineer and AI-Video Technical Lead I architect the platform —
  how multiple AI applications share a single embedded GPU safely, how
  medical and non-medical software stay cleanly separated for IEC 62304
  Class C compliance, and how the system delivers sub-10 ms overlay latency
  on every surgical frame.
highlights:
  - "Three architecture goals: isolation (multiple AI apps share one embedded GPU without interfering), segregation (clean medical / non-medical software boundaries for IEC 62304 Class C compliance), and performance (sub-10 ms overlay latency for responsive surgical guidance)."
  - "Modular multi-process design — one responsibility per service with isolated resources. Zenoh provides Pub/Sub, RPC and shared-memory IPC with zero-copy video transport to hold the latency budget."
  - "AI Manager controls inference end-to-end: prevents parallel overloads, enforces valid AI combinations, monitors latency, and recovers from failure modes such as stalled pipelines."
  - "Automated end-to-end model verification: every AI model is tested against the platform pipeline before deployment, preventing regressions and making multi-team AI delivery feasible."
  - "Unified development environment for engineers and CI via dev containers (same OS, compilers, tools and debug scripts on x86 and ARM) — cuts onboarding time and eliminates build-environment drift."
  - "Modular build system — teams compile only what they need for fast iteration, features can be compiled out for releases, and shared code stays in sync across variants."
  - "Shared platform libraries (IPC, logging, benchmarking, monitoring, scheduling) plus tooling for video and AI data recording — so teams do not reinvent the wheel."
  - "Hardware-in-the-Loop integration testing: a setup that drives system inputs and captures outputs automatically, enabling regression tests of the full video → AI → output pipeline on real hardware."
  - "Documentation as an engineering discipline: improved Software Architecture Document and SDD practices, moved design docs next to the code (versioned, reviewable, CI-published), enabled variant-aware generation so one source of truth produces per-product submission artefacts."
  - "Agentic-AI engineering workspace for developing, documenting and reviewing the platform with AI assistance — already in daily use, accelerating documentation authoring, compliance auditing, FMEA review and regulatory preparation."
