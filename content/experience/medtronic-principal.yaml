tagline: Built the AI inference pipeline delivering real-time surgical guidance on embedded GPUs in the operating room.
summary: >
  Joined Medtronic Digital Surgery as Principal Software Engineer to
  turn research models into regulated product software.

  Built the inference pipeline and tooling that brought real-time
  PyTorch/ONNX surgical AI onto embedded GPUs, established on-target
  validation and benchmarking for model verification, and led monorepo
  and build/CI improvements that laid the groundwork for the later
  AI-video platform.
highlights:
  - Achieved sub-10 ms inference on Jetson Orin with >99% accuracy using model compression and quantization-aware training.
  - Built an automated AI model conversion and verification pipeline converting PyTorch models to TensorRT, validating on- and off-target datasets spanning thousands of hours of annotated video.
  - Containerized the dev and CI toolchain across x86/ARM targets, guaranteeing reproducible builds and test environments.
  - Designed modular build system enabling feature-gated releases across product variants from shared code.
