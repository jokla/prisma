summary: >
  Joined Medtronic Digital Surgery as Principal Software Engineer,
  transitioning into the medical-robotics industry and quickly expanding
  from high-impact individual delivery into broader technical ownership.
  In this phase I led the transition of AI models from PyTorch, as
  delivered by the ML team, into production-optimised embedded
  inference inside a regulated medical-device environment, built a
  validation framework for speed and accuracy of AI models on the
  embedded target, developed a modular mono-repository with a scalable
  build system, and raised the engineering bar through stronger
  tooling, architecture choices and code-review practices. This period
  established the platform foundations and technical trust that led to
  promotion into AI-video technical leadership.
highlights:
  - Led the transition of AI models from PyTorch (as delivered by the ML team) to production-optimised embedded inference in a regulated medical-device environment, re-engineering models for lowest-possible latency on constrained embedded GPUs while preserving accuracy, enabling real-time surgical guidance on lower-spec hardware and reducing BOM cost.
  - Built a repeatable validation and benchmarking framework for AI model speed and accuracy on the embedded target, making deployment-readiness decisions data-driven.
  - Led the migration to a modular mono-repository with a scalable build system and module isolation, lifting CI efficiency and codebase consistency across the software org.
  - Drove adoption of stronger software-engineering practices through code reviews, collaborative design and day-to-day guidance, establishing the technical trust that led to promotion into AI-video technical leadership.
