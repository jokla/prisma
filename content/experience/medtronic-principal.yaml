tagline: Brought PyTorch surgical-AI models into real-time embedded production on a Class C medical device.
summary: >
  Joined Medtronic Digital Surgery as Principal Software Engineer,
  moving from autonomous systems into medical robotics and from hands-on
  delivery into broader technical ownership.

  I built the inference pipeline and toolchain that brought real-time
  PyTorch surgical AI into a Class C regulated device, created
  validation and benchmarking workflows for model verification, led the
  monorepo migration, and raised engineering practices across the team.
  This work laid the platform foundations for my later AI-video
  technical lead role.
highlights:
  - Took ML-delivered PyTorch/ONNX models to embedded production by optimizing inference for lowest-latency execution on constrained GPUs.
  - Built a repeatable on-target validation + benchmarking harness to quantify speed/accuracy trade-offs and produce verification-ready evidence for release decisions.
  - Led a migration to a modular monorepo and scalable build/CI approach, improving module isolation, consistency, and delivery throughput across the org.
  - Strengthened engineering rigor via hands-on code reviews and collaborative design, elevating quality/compliance discipline and building the technical trust that enabled progression into AI-video technical leadership.
