tagline: Shipped real-time PyTorch surgical-AI models on embedded GPUs for a Class C medical device.
summary: >
  Joined Medtronic Digital Surgery as Principal Software Engineer to
  turn research models into regulated product software.

  Built the inference pipeline and tooling that brought real-time
  PyTorch/ONNX surgical AI onto embedded GPUs, established on-target
  validation and benchmarking for model verification, and led monorepo
  and build/CI improvements that laid the groundwork for the later
  AI-video platform.
highlights:
  - Productionized PyTorch/ONNX models for low-latency execution on embedded NVIDIA GPUs in a Class C medical device.
  - Built on-target validation and benchmarking workflows to measure latency/accuracy trade-offs and generate evidence for release and verification reviews.
  - Led the move to a modular monorepo with scalable build/CI pipelines, improving module ownership, integration consistency, and release execution.
  - Raised the engineering bar through code reviews, architecture discussions, and hands-on delivery, building the trust that led to AI-video technical leadership.
