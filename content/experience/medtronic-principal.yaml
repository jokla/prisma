tagline: Shipped real-time PyTorch surgical-AI models on embedded GPUs for a Class C medical device.
summary: >
  Joined Medtronic Digital Surgery as Principal Software Engineer to
  turn research models into regulated product software.

  Built the inference pipeline and tooling that brought real-time
  PyTorch/ONNX surgical AI onto embedded GPUs, established on-target
  validation and benchmarking for model verification, and led monorepo
  and build/CI improvements that laid the groundwork for the later
  AI-video platform.
highlights:
  - Optimized PyTorch/ONNX models to achieve sub-10 ms inference on Jetson Orin while preserving over 99% of baseline accuracy, using model compression, quantization-aware training, and sparsity techniques.
  - Delivered an automated AI model conversion and verification pipeline that converted PyTorch models to TensorRT, validated them on and off target against thousands of hours of annotated video, and gated releases on latency and accuracy performance.
  - Built a platform with shared x86/ARM dev containers and modular builds, giving engineers and CI the same toolchain, reducing onboarding and environment drift, and enabling feature-gated releases while keeping shared code aligned across product variants.
