tagline: Built navigation and simulation software for Arrival's autonomous mobile robot fleet.
summary: >
  First role at Arrival, on the Autonomous Navigation team, building
  navigation and simulation software for the autonomous mobile robots
  (AMRs) that assemble vehicles in Arrival's microfactories. Worked
  on multi-robot ROS architecture, robot abilities for movement and
  docking, and the test infrastructure used to validate the fleet
  before promotion into the senior vision role after 18 months.
highlights:
  - Developed navigation and simulation software for the WeMo AMR fleet deployed in Arrival's microfactories.
  - Designed ROS multi-master and Docker-based development workflows for distributed multi-robot integration and testing.
  - Defined and implemented robot ability interfaces for motion, docking and state reporting used by higher-level factory orchestration.
  - Built fleet test infrastructure and bring-up workflows spanning simulation, hardware integration and sensor setup.
