tags: [autonomous-navigation, kubernetes, ros, cpp, dds, integration-testing, gazebo, unreal-engine]
tagline: Developed navigation algorithms and simulation tooling for Arrival's autonomous mobile robot fleet.
summary: >
  First role at Arrival, on the Autonomous Navigation team, building
  navigation and simulation software for the autonomous mobile robots
  (AMRs) in Arrival's microfactories. Worked
  on multi-robot ROS architecture, robot abilities for movement and
  docking, and the test infrastructure used to validate the fleet
  before promotion into the senior vision role after 18 months.
highlights:
  - Integrated lidar-based navigation stack for the WeMo AMR fleet, and state reporting to the factory orchestrator.
  - Implemented a visual servoing algorithm for automatic docking to charge and factory stations.
  - Built the fleet simulation environment used to validate navigation and docking behavior before hardware deployment.
