tagline: Built navigation and simulation software for Arrival's autonomous mobile robot fleet.
summary: >
  First role at Arrival, on the Autonomous Navigation team, building
  navigation and simulation software for the autonomous mobile robots
  (AMRs) that assemble vehicles in Arrival's microfactories. Worked
  on multi-robot ROS architecture, robot abilities for movement and
  docking, and the test infrastructure used to validate the fleet
  before promotion into the senior vision role after 18 months.
highlights:
  - Built navigation and simulation software for the WeMo AMR fleet that assembles vehicles in Arrival's microfactories.
  - Defined the motion, docking and state-reporting interfaces consumed by the factory orchestrator.
  - Stood up fleet bring-up and test infrastructure spanning simulation, hardware integration and sensor setup.
