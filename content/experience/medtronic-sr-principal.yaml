tagline: Owned the AI-video platform for medical surgical-guidance device, from GPU scheduling to release strategy.
summary: >
  Promoted to Sr. Principal Software Engineer and AI-Video Technical
  Lead to own the architecture and roadmap for Medtronic's surgical
  AI-video platform.

  Led the move from prototype to release-ready system by designing the
  GPU scheduler, inference runtime, safety-overlay path, and
  recording/logging pipeline; driving FDA-submission work for AI-video
  features; and leading a team of 5 across ML, Systems, Quality,
  Regulatory, and UI teams.
highlights:
  - Architected a regulated AI-video platform with three core goals: isolate multiple AI apps sharing one GPU, enforce clear medical/non-medical boundaries, and low overlay latency for real-time surgical guidance.
  - Designed core runtime capabilities including AI scheduling and monitoring, inference hardening, video and AI data recording, CPU/GPU image processing and overlay generation.
  - Drove alignment across ML, Systems, Quality, Regulatory, and UI teams to define the delivery roadmap.
  - Built a unified engineering platform with shared x86/ARM dev containers, modular builds, and common IPC, logging, benchmarking, monitoring, and scheduling libraries, reducing environment drift and keeping product variants in sync.
  - Automated end-to-end AI model verification across the platform pipeline before deployment, preventing regressions and making multi-team AI delivery feasible on shared infrastructure.
  - Made documentation a first-class engineering asset by moving architecture and design docs into the codebase and CI-publishing variant-aware submission artefacts from one source of truth.
  - Introduced an agentic-AI engineering workspace used daily for platform development, documentation, compliance auditing, FMEA review, and regulatory preparation.
  - Technical lead for a team of 5 engineers, combining hands-on architecture work with mentoring, reviews, and pairing.
