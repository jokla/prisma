tagline: Lead architecture and delivery of a regulated AI-video platform on embedded GPUs, enabling multiple AI applications to share a single GPU while meeting strict medical isolation and latency requirements.
summary: >
  Stepped into the AI-Video Technical Lead role to own the architecture
  and delivery of Medtronic's regulated surgical AI-video platform, a
  system that delivers real-time AI guidance during robotic and
  laparoscopic surgery, from prototype to release.

  The platform is built around three goals: isolation (multiple AI
  applications sharing a single embedded GPU without interference),
  segregation (clean medical/non-medical software boundaries for IEC
  62304 Class C compliance), and performance (sub-10 ms inference latency
  on every surgical frame). Achieving this required a modular
  multi-process design with one responsibility per service, a
  pub/sub and shared-memory IPC layer for zero-copy video
  transport, and an AI Manager that controls inference end-to-end,
  preventing parallel overloads, enforcing valid AI combinations, and
  recovering from failure modes.

  Beyond the runtime, the role spans the full delivery stack: unified
  dev containers for engineers and CI, a modular build system enabling
  feature-gated releases across product variants, shared platform
  libraries, hardware-in-the-loop integration testing, and
  documentation practices that feed directly into FDA submission
  artefacts. As technical anchor across ML, Systems, Quality,
  Regulatory, and UI teams, this role owns technical decisions from
  architecture through regulatory sign-off.
highlights:
  - Defined and owned the software architecture for a regulated AI-video platform, enabling multiple AI applications to share a single GPU with strict medical/non-medical isolation and sub-frame overlay latency for real-time surgical guidance.
  - Defined a C++ runtime stack (AI manager, scheduler, TensorRT inference, video/AI recording) with shared libraries for IPC, logging, benchmarking and monitoring.
  - Led cross-functional AI-video delivery across ML, Systems, Quality, Regulatory and UI teams, from architecture to regulatory sign-off.
  - Co-located architecture and documentation with code, publishing variant-aware regulatory artifacts via CI to eliminate drift before FDA submissions.
  - Introduced an agentic-AI workspace adopted daily for development, documentation, compliance auditing, FMEA review and regulatory preparation.
  - Mentored 5+ engineers through code pairing and technical reviews, increasing delivery pace and design quality.
