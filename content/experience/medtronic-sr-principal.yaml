tagline: Owned the AI-video platform for medical surgical-guidance device, from GPU scheduling to release strategy.
summary: >
  Promoted to Sr. Principal Software Engineer and AI-Video Technical
  Lead to own the architecture and roadmap for Medtronic's surgical
  AI-video platform.

  Led the move from prototype to release-ready system by designing the
  GPU scheduler, inference runtime, safety-overlay path, and
  recording/logging pipeline; driving FDA-submission work for AI-video
  features; and leading a team of 5 across ML, Systems, Quality,
  Regulatory, and UI teams.
highlights:
  - Defined and owned the software architecture for a regulated AI-video platform, enabling multiple AI applications to share a single GPU with strict medical/non-medical isolation and sub-frame overlay latency for real-time surgical guidance.
  - Architected and implemented the core C++ runtime stack: AI manager and scheduler, TensorRT inference, video/AI recording and shared libraries for IPC, logging, benchmarking, and monitoring.
  - Drove cross-functional alignment across ML, Systems, Quality, Regulatory, and UI teams, defining a unified delivery roadmap that unblocked parallel workstreams.
  - Embedded architecture and design documentation into the codebase with CI-published, variant-aware submission artefacts, creating a single source of truth for regulatory deliverables.
  - Introduced an agentic-AI engineering workspace adopted daily across the team for platform development, documentation, compliance auditing, FMEA review, and regulatory preparation.
  - Led a team of 5 engineers through hands-on technical leadership, mentoring, and pairing, raising team capability and execution quality.
