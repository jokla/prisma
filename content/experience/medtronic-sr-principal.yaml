tagline: Owned the AI-video platform for medical surgical-guidance device, from GPU scheduling to release strategy.
summary: >
  Promoted to Sr. Principal Software Engineer and AI-Video Technical
  Lead to own the architecture and roadmap for Medtronic's surgical
  AI-video platform.

  Led the move from prototype to release-ready system by designing the
  GPU scheduler, inference runtime, safety-overlay path, and
  recording/logging pipeline; driving FDA-submission work for AI-video
  features; and leading a team of 5 across ML, systems, quality,
  regulatory, and UI.
highlights:
  - Architected a regulated AI-video platform with three core goals: isolate multiple AI apps sharing one GPU, enforce clear medical/non-medical boundaries, and low overlay latency for real-time surgical guidance.
  - Designed core runtime capabilities including AI scheduling, inference hardening, video and AI data recording, overlay generation, time synchronisation, and benchmarking.
  - Served as the liaison between ML, Systems, Quality, Regulatory, and UI teams, translating requirements into a clear delivery roadmap.
  - Built a modular platform using shared x86/ARM containers and common libraries; added automated AI model verification for scalable AI features.
  - Created hardware-in-the-loop and CI-published docs frameworks; established variant-aware build/versioning for repeatable releases and regression testing.
  - Technical lead for a team of 5 engineers, combining hands-on architecture work with mentoring, reviews, and pairing.
