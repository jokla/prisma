tagline: Architecting a regulated, multi-AI GPU platform for real-time surgical guidance.
summary: >
  Promoted to Sr. Principal Software Engineer and AI-Video Technical
  Lead. I own the software architecture and technical roadmap for the
  surgical-guidance AI/video pipeline, balancing safe GPU sharing
  across multiple AI apps, clear medical and non-medical software
  boundaries for regulatory compliance, and sub-10 ms overlay latency.

  I translate requirements across ML, Systems Engineering, Quality,
  Regulatory, and UI, designed the CI system for automated AI-model
  verification, and mentor a team of 5 engineers while driving shared
  platform tooling across the project.
highlights:
  - Architected an IEC 62304 Class C-ready AI-video platform that runs multiple AI workloads on a shared embedded GPU with sub-10 ms overlay latency.
  - Designed core runtime capabilities including AI scheduling, inference hardening, time synchronisation, and observability for benchmarking and diagnosis.
  - Defined release, branching, and multi-model management practices to scale AI delivery under regulated change control.
  - Act as the technical bridge across ML, Systems, Quality, Regulatory, and UI, turning algorithm requirements into platform contracts and delivery plans.
  - Technical lead for a team of 5 engineers, combining hands-on architecture work with mentoring, reviews, and pairing.
