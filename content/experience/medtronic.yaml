summary: >
  I lead the development of real-time AI and video processing pipelines for
  both robotic-assisted and conventional laparoscopic surgery. My work
  focuses on optimising and deploying deep learning models on edge devices
  with NVIDIA GPUs to ensure reliable performance in the operating room.
  I work closely with a multidisciplinary team of machine-learning
  researchers, embedded engineers and designers to deliver high-performance,
  secure and reliable software for next-generation medical devices.
highlights:
  - Designing and implementing a high-performance video pipeline to provide surgical guidance during robotic-assisted procedures.
  - Optimising and deploying object detection and image segmentation networks on edge devices with NVIDIA GPUs.
