tagline: ML and computer vision technical lead across autonomous driving, urban mobility and flying-car projects.
summary: >
  Joined Italdesign's new Autonomous Driving team as robotics expert.
  Technical lead for machine-learning and computer-vision work across
  InTo, Pop.Up Next, Wheem-i and Roborace, and responsible for the
  sensor set and full autonomous-driving stack (perception, mapping,
  localisation, planning, control) on the Italdesign prototype
  vehicle. Built the software infrastructure from scratch, selected
  the sensor and compute platform, and set up SIL/HIL validation to
  deliver the first autonomous shuttle and flying-car demonstrations.
highlights:
  - Pop.Up (with Audi & Airbus): built drone localization, and autonomous latching. Demo at Amsterdam Drone Week 2018.
  - Autonomous Driving: built sensor stack, perception, mapping, planning, control, logging/replay, and SIL/HIL testing.
  - InTo: led ML/CV for crowd-density and passenger-flow prediction using onboard and station cameras; deployed at a Turin metro station in 2019.
  - Wheem-i: built obstacle/free-space perception and shared-control driver assistance for a semi-autonomous mobility device; finalist in Toyota's $4M Mobility Unlimited Challenge.
  - Roborace: trained and deployed CNNs for object detection and semantic segmentation on autonomous racing car.
