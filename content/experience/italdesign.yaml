tagline: Technical lead for ML and computer vision across autonomous driving, urban mobility and flying-car projects.
summary: >
  Joined Italdesign's new Autonomous Driving team as robotics expert.
  Technical lead for machine-learning and computer-vision work across
  InTo, Pop.Up Next, Wheem-i and Roborace, and responsible for the
  sensor set and full autonomous-driving stack (perception, mapping,
  localisation, planning, control) on the Italdesign prototype
  vehicle. Built the software infrastructure from scratch, selected
  the sensor and compute platform, and set up SIL/HIL validation to
  deliver the first autonomous shuttle and flying-car demonstrations.
highlights:
  - Pop.Up Next (Audi & Airbus modular flying car): owned the software architecture, sensor set and validation strategy. Built vision-based drone detection and pose estimation from the car module, plus the autonomous centring and latching with the drone module — demonstrated as a 1:4 scale flying model at Amsterdam Drone Week 2018.
  - Italdesign prototype vehicle: designed the sensor set (camera, lidar, radar, GNSS, IMU, ultrasonic) and built the full autonomy stack — perception, multi-sensor SLAM, planning, control — with logging, replay and SIL/HIL pipelines in CARLA and dSPACE.
  - InTo: ML/CV technical lead for a crowd-density and passenger-flow prediction service combining CNNs across on-board and station cameras — deployed in production at Turin's Re Umberto metro station (May 2019).
  - Wheem-i: built the perception system (obstacle and free-space detection) and human-machine shared control with driver-assistance for a semi-autonomous device for wheelchair users. Finalist in the $4M Toyota Mobility Unlimited Challenge (Toyota Mobility Foundation).
  - Roborace: trained and deployed CNNs for perception (object detection, semantic segmentation) on the autonomous-racing car."
