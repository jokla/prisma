tags: [autonomous-driving, perception, deep-learning, slam, cpp, ros]
tagline: Technical lead for ML and computer vision across autonomous driving, urban mobility and flying-car projects.
summary: >
  Joined Italdesign's new Autonomous Driving team as robotics expert.
  Technical lead for machine-learning and computer-vision work across
  InTo, Pop.Up Next, Wheem-i and Roborace, and responsible for the
  sensor set and full autonomous-driving stack (perception, mapping,
  localisation, planning, control) on the Italdesign prototype
  vehicle. Built the software infrastructure from scratch, selected
  the sensor and compute platform, and set up SIL/HIL validation to
  deliver the first autonomous shuttle and flying-car demonstrations.
highlights:
  - Pop.Up Next (Audi & Airbus): built drone detection, pose estimation, and autonomous latching for the 1:4 flying prototype shown at Amsterdam Drone Week 2018.
  - Prototype vehicle: designed the sensor stack and built perception, multi-sensor SLAM, planning, and control, plus logging/replay and SIL/HIL in CARLA and dSPACE.
  - InTo: led ML/CV for crowd-density and passenger-flow prediction using onboard and station cameras; deployed at Turin's Re Umberto metro station in 2019.
  - Wheem-i: built obstacle/free-space perception and shared-control driver assistance for a semi-autonomous mobility device; finalist in Toyota's $4M Mobility Unlimited Challenge.
  - Roborace: trained and deployed CNNs for object detection and semantic segmentation on an autonomous racing car.
