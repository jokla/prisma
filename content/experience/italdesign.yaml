tags: [autonomous-driving, perception, deep-learning, slam, cpp, ros]
tagline: Technical lead for ML and computer vision across autonomous driving, urban mobility and flying-car projects.
summary: >
  Joined Italdesign's new Autonomous Driving team as robotics expert.
  Technical lead for machine-learning and computer-vision work across
  InTo, Pop.Up Next, Wheem-i and Roborace, and responsible for the
  sensor set and full autonomous-driving stack (perception, mapping,
  localisation, planning, control) on the Italdesign prototype
  vehicle. Built the software infrastructure from scratch, selected
  the sensor and compute platform, and set up SIL/HIL validation to
  deliver the first autonomous shuttle and flying-car demonstrations.
highlights:
  - Technical lead for ML and computer vision on InTo, an AI coach-crowding prediction service deployed in production at Turin Re Umberto metro station (May 2019).
  - Owned the software architecture, validation strategy and sensor set of Pop.Up Next, the Airbus and Audi modular flying-car concept, delivering an autonomous shuttle demo in six months and the drone-alignment/latching demo shown at Amsterdam Drone Week 2018.
  - Built the full autonomy stack (perception, SLAM, planning, control) from scratch on the Italdesign prototype, including logging, replay, and SIL/HIL validation pipelines in CARLA and dSPACE.
  - Trained and deployed CNNs for object detection and semantic segmentation on Wheem-i (Toyota Mobility Unlimited Challenge finalist) and Roborace.
