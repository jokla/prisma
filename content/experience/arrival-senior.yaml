summary: >
  Senior role at Arrival after promotion from the Autonomous Navigation
  team. Led the vision system (hardware and software) of the Autonomous
  Mobile Robot (WeMo) fleet of 100+ robots used in Arrival's
  microfactories, including vision-based positioning, automated
  calibration and end-of-line validation tooling.
highlights:
  - Led the vision system (hardware and software) for the WeMo Autonomous Mobile Robot fleet of 100+ robots operating Arrival's microfactories.
  - Designed and implemented a vision-based positioning method achieving millimetre and sub-degree accuracy, enabling precision docking in assembly cells.
  - Designed and deployed an automated intrinsic and extrinsic calibration pipeline across the fleet, removing manual calibration from end-of-line and cutting commissioning time per robot.
  - Built automated tooling for camera sub-assembly, calibration and end-of-line robot validation.
