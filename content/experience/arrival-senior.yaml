tagline: Led the vision system for a 100+ autonomous mobile robot fleet running Arrival's microfactories.
summary: >
  Promoted into a senior role to lead the vision system for Arrival's
  WeMo fleet in the microfactories. I owned vision-based docking,
  automated calibration, and end-of-line validation tooling used to
  commission robots at scale and keep positioning performance reliable
  across hardware variation and factory deployments.
highlights:
  - Led the vision system for the 100+ WeMo fleet used in Arrival's microfactories.
  - Designed and deployed a vision-based relative-positioning method for repeatable sub-centimetre, sub-degree docking accuracy in assembly cells.
  - Made target poses transferable across robots and pallet configurations through calibration, reducing setup effort without losing accuracy.
  - Built an automated intrinsic and extrinsic calibration pipeline, removing manual calibration from end-of-line commissioning.
  - Developed tooling for camera sub-assembly, calibration-data management, and end-of-line validation used during fleet rollout in Bicester.
