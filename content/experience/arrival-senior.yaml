tagline: Led the vision system for a 100+ autonomous mobile robot fleet running Arrival's microfactories.
summary: >
  Senior role at Arrival after promotion from the Autonomous Navigation
  team. Led the vision system (hardware and software) of the Autonomous
  Mobile Robot (WeMo) fleet of 100+ robots used in Arrival's
  microfactories, including vision-based positioning for precision
  docking, automated intrinsic and extrinsic calibration, and
  end-of-line validation tooling rolled out to factory deployments.
highlights:
  - Led the vision system (hardware and software) for the WeMo Autonomous Mobile Robot fleet of 100+ robots operating Arrival's microfactories.
  - Designed and implemented a vision-based relative-positioning method achieving repeatable sub-centimetre and sub-degree docking accuracy in assembly cells.
  - Extended the method to robot clusters, so target poses learned on one robot could be reused across other robots and multi-robot pallet configurations while preserving required accuracy after calibration.
  - Designed and deployed an automated intrinsic and extrinsic calibration pipeline across the fleet, removing manual calibration from end-of-line and cutting commissioning time per robot.
  - Made the positioning stack robust to lens and sensor variation, camera placement differences and manufacturing tolerances, then validated performance through motion-capture accuracy testing.
  - Built automated tooling for camera sub-assembly, calibration-data management and end-of-line robot validation.
  - Supported rollout and validation of the vision stack on WeMo's fleet in the Bicester microfactory.
