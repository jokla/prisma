  - Owned the hardware and software vision system across the 100+ WeMo autonomous mobile robots running Arrival's Bicester microfactory.
  - Designed and shipped vision-based relative positioning achieving sub-centimetre, sub-degree docking accuracy, repeatable across robots in single and cluster configurations.
  - Built the automated calibration and end-of-line validation tooling, eliminating manual commissioning steps and unblocking the AMR fleet rollout.
