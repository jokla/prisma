summary: >
  Senior role at Arrival after promotion from the Autonomous Navigation
  team. Responsible for the vision system of the Autonomous Mobile Robot
  (WeMo) fleet used in Arrival's microfactories — hardware, software,
  calibration and end-of-line validation — plus vision-based positioning
  research.
highlights:
  - Responsible for the vision system of the Autonomous Mobile Robot WeMo (hardware and software).
  - Designed and implemented a vision-based positioning method achieving millimetre and sub-degree accuracy.
  - Designed and deployed an automated intrinsic and extrinsic parameter calibration process for the WeMo fleet.
  - Implemented automated tools for camera sub-assembly, calibration and end-of-line robot validation.
