tags: [visual-servoing, humanoid-robots, manipulation, computer-vision, ros, cpp, matlab]
tagline: Real-time perception and visual servoing for humanoid, mobile, industrial and aerial robots.
summary: >
  Joined the Lagadic team at INRIA Rennes as an R&D engineer under
  François Chaumette. My goal was to make robots smarter, helping
  them perceive and understand the world and act autonomously.

  Worked on real-time detection, pose estimation, tracking and visual
  servoing for mobile, humanoid, industrial and aerial robots;
  contributed to a rapid-prototyping framework based on ROS,
  MATLAB/Simulink and V-REP for sensor-based control algorithms;
  supervised several student internships; and co-authored publications
  at RA-L / ICRA 2017 and Humanoids 2016.
highlights:
  - Co-authored peer-reviewed publications at IEEE RA-L / ICRA 2017 and Humanoids 2016 on visual servoing for whole-body humanoid control and dual-arm manipulation.
  - Built a rapid-prototyping framework on ROS, MATLAB/Simulink and V-REP adopted team-wide for sensor-based control experiments.
  - Implemented real-time detection, pose estimation and visual-servoing algorithms across drones, mobile, industrial and humanoid robots (Romeo, Pepper).
  - Supervised student interns through research projects end-to-end.
