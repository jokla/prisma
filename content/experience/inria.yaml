tags: [visual-servoing, research-engineering, ros, cpp, matlab-simulink, simulation, humanoid-robots]
tagline: Four years of perception and visual-servoing research across humanoid, mobile, industrial and aerial robots.
summary: >
  Joined the Lagadic team at INRIA Rennes, one of the leading groups
  in visual servoing research, as an R&D engineer under François
  Chaumette. Worked across the full perception-to-control stack for
  humanoid, mobile, industrial and aerial robots over four years.

  Developed perception and visual-servoing capabilities for the Romeo
  and Pepper humanoid robots, covering single- and dual-arm grasping,
  door opening, whole-body control, people following and obstacle
  avoidance. As part of the Comanoid project with Airbus, integrated
  visual-servoing tasks into a QP-based whole-body controller enforcing
  balance, posture and joint-limit constraints, leading to a RA-L
  / ICRA 2017 publication. Built a ROS + MATLAB/Simulink + V-REP
  rapid-prototyping framework adopted across the team for validating
  algorithms in simulation before deploying the same controllers to
  real robots.

  Co-authored papers at RA-L / ICRA 2017 and Humanoids 2016, supervised
  research interns, and open-sourced VispNaoqi and RomeoTk, libraries
  that bridged ViSP with the NaoQi SDK and packaged the Romeo research
  toolkit for the community.
highlights:
  - Four years of perception, navigation and visual-servoing research  across drones, mobile, industrial and humanoid robots.
  - Built a ROS + MATLAB/Simulink + V-REP framework to validate algorithms in simulation and deploy identical code to real robots.
  - Implemented visual servoing on Romeo and Pepper for grasping, dual-arm manipulation, and obstacle-aware people following.
  - Supervised research interns end-to-end on perception and control projects.
