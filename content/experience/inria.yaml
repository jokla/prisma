tags: [visual-servoing, research-engineering, ros, cpp, matlab-simulink, simulation, humanoid-robots]
tagline: Real-time perception and visual servoing for humanoid, mobile, industrial and aerial robots.
summary: >
  Joined the Lagadic team at INRIA Rennes as an R&D engineer under
  François Chaumette. My goal was to make robots smarter, helping
  them perceive and understand the world and act autonomously.

  Worked on real-time detection, pose estimation, tracking and visual
  servoing for mobile, humanoid, industrial and aerial robots;
  built a rapid-prototyping framework based on ROS, MATLAB/Simulink
  and V-REP to validate control algorithms in simulation first and
  then deploy the same MATLAB/Simulink and C++ controllers to real
  robots;
  supervised several student internships; and co-authored publications
  at RA-L / ICRA 2017 and Humanoids 2016.
highlights:
  - Four years of perception, navigation and visual-servoing research  across drones, mobile, industrial and humanoid robots.
  - Built a ROS + MATLAB/Simulink + V-REP framework: validate algorithms in simulation, deploy the identical code to real robots.
  - Implemented visual servoing on Romeo and Pepper for grasping, dual-arm manipulation, and obstacle-aware people following.
  - Supervised research interns end-to-end on perception and control projects.
