# Short bio, used on the website About / Home pages and as the CV header
# tagline. First-person, general across the full career arc.
short: >
  Hi! I'm Giovanni Claudio, a Senior Principal Software Engineer based
  in London. I have 12+ years of experience architecting real-time
  perception, computer vision and AI/video systems across humanoid
  robotics research at INRIA, autonomous vehicles and smart mobility
  at Italdesign Giugiaro, autonomous mobile robots at Arrival, and now
  surgical robotics at Medtronic, where I'm the AI/Video technical lead
  and software architect for Touch Surgery™ Aide. I enjoy turning research-grade models
  into reliable, certified products on embedded hardware, and leading
  the cross-team work it takes to get there. Originally from Genoa,
  Italy.

# Short, playful bio for the website Home page. List of paragraphs.
home:
  - >
    Senior Principal Software Engineer at Medtronic, where I'm the AI/Video
    technical lead and a software architect for Touch Surgery™ Aide, a
    high-performance video and AI platform that brings real-time
    guidance into the operating room.
  - >
    Born in Genoa, the land of pesto, focaccia, and Genoa CFC, a
    football club I keep supporting against better judgement. My
    surname is Claudio (yes, also a first name, no, I can't explain
    it). When AI finally replaces us software engineers, I've got two
    backup plans ready: gelato sommelier or cat photographer.

# Long bio, used on the website About page. List of paragraphs.
long:
  - >
    I'm a Senior Principal Software Engineer with 12+ years of experience
    architecting perception, computer-vision and AI/video systems across
    medical robotics, autonomous vehicles and humanoid platforms. My work
    spans humanoid manipulation and visual servoing at INRIA, autonomous
    driving and smart mobility at Italdesign Giugiaro, autonomous mobile
    robots at Arrival, and now real-time AI/video pipelines for robotic
    and laparoscopic surgery at Medtronic.
  - >
    I especially enjoy the problem of turning research-grade perception
    models into reliable, deployable systems on constrained embedded
    hardware, and working across the machine-learning, embedded,
    platform and product-design disciplines it takes to get there.
  - >
    At Medtronic, I'm the AI/Video technical lead and a software architect
    for Touch Surgery™ Aide, a computer that runs AI on live surgical video
    while the operation is happening. I bring the same approach I
    developed across autonomous vehicles, mobile robotics and humanoid
    research: making perception robust enough for real hardware under
    real constraints. Here that means designing the software and CI
    pipeline for a system where reliability, regulatory compliance and
    real-time performance all matter at once, and helping shape the
    design decisions that span teams, so everyone builds one coherent system.

origin: Genoa, Italy

